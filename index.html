<title>Zomin Restaurant — Menu</title>
<style>
  :root {
    --bg: #0d3324;
    --bg-2: #14432f;
    --card: #174c37;
    --line: rgba(232, 197, 71, 0.22);
    --gold: #e8c547;
    --cream: #f6f1e4;
    --muted: #b9c9bd;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    /* The menu is always dark for brand consistency; this keeps the scheme explicit. */
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, var(--bg) 0%, #0a281c 100%);
    background-color: var(--bg);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  header.hero {
    text-align: center;
    padding: 36px 16px 22px;
  }
  .hero h1 {
    margin: 0;
    font-size: clamp(30px, 8vw, 44px);
    letter-spacing: 2px;
    color: var(--gold);
    font-weight: 800;
  }
  .hero .sub {
    margin: 6px 0 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .hero .notice {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    color: var(--bg);
    background: var(--gold);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 600;
  }

  /* Category navigation: horizontal scroll inside its own strip, page itself never scrolls sideways */
  nav.cats {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13, 51, 36, 0.96);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  nav.cats ul {
    list-style: none;
    margin: 0;
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav.cats ul::-webkit-scrollbar { display: none; }
  nav.cats a {
    display: inline-block;
    white-space: nowrap;
    color: var(--cream);
    text-decoration: none;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
  }
  nav.cats a.active {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
    font-weight: 700;
  }

  main { padding: 8px 16px 24px; max-width: 960px; margin: 0 auto; }
  section.cat { padding-top: 26px; scroll-margin-top: 64px; }
  .cat-head { margin: 0 0 14px; }
  .cat-head h2 {
    margin: 0;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .cat-head p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .item .info { min-width: 0; flex: 1; }
  .item .name {
    font-weight: 700;
    font-size: 16px;
    color: var(--cream);
    overflow-wrap: anywhere;
  }
  .item .tag {
    font-weight: 400;
    font-size: 13px;
    color: var(--gold);
    margin-left: 4px;
  }
  .item .desc {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .item .price {
    flex: 0 0 auto;
    text-align: right;
    font-weight: 700;
    font-size: 16px;
    color: var(--gold);
    white-space: nowrap;
    padding-top: 1px;
  }
  .item .price small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .item .price.ask {
    font-weight: 500;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .item.featured {
    border-color: var(--gold);
    background: linear-gradient(135deg, #1d5a41, var(--card));
  }
  .item .includes {
    margin: 6px 0 0;
    padding-left: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  footer.contact {
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 28px 16px 40px;
    font-size: 14px;
    color: var(--muted);
  }
  footer.contact a { color: var(--gold); text-decoration: none; }
  footer.contact .row { margin: 6px 0; }
  footer.contact .thanks {
    color: var(--cream);
    font-size: 15px;
    margin-bottom: 12px;
  }

/* ============================================================
   RENDERING — no need to edit below this line
   ============================================================ */
(function () {
  const menuEl = document.getElementById("menu");
  const navEl = document.getElementById("catnav");

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function priceNode(item) {
    const wrap = el("div", "price");
    if (item.price === null || item.price === undefined) {
      wrap.classList.add("ask");
      wrap.textContent = CONFIG.missingPriceText;
    } else if (typeof item.price === "number") {
      wrap.textContent = CONFIG.currency + item.price.toLocaleString("en-US");
    } else {
      // free-text price, e.g. "4000&5000"
      wrap.textContent = CONFIG.currency + String(item.price).replace(/&/g, " / ");
    }
    if (item.unit) wrap.appendChild(el("small", null, item.unit));
    return wrap;
  }

  MENU.forEach(function (cat) {
    // nav chip
    const li = el("li");
    const a = el("a", null, cat.title);
    a.href = "#" + cat.id;
    a.dataset.target = cat.id;
    li.appendChild(a);
    navEl.appendChild(li);

    // section
    const section = el("section", "cat");
    section.id = cat.id;
    const head = el("div", "cat-head");
    head.appendChild(el("h2", null, cat.title));
    if (cat.sub) head.appendChild(el("p", null, cat.sub));
    section.appendChild(head);

    const grid = el("div", "grid");
    cat.items.forEach(function (item) {
      const card = el("article", item.featured ? "item featured" : "item");
      const info = el("div", "info");
      const name = el("div", "name", item.name);
      if (item.tag) name.appendChild(el("span", "tag", "· " + item.tag));
      info.appendChild(name);
      if (item.desc) info.appendChild(el("p", "desc", item.desc));
      card.appendChild(info);
      card.appendChild(priceNode(item));
      grid.appendChild(card);
    });
    section.appendChild(grid);
    menuEl.appendChild(section);
  });

  // highlight the category currently on screen
  if ("IntersectionObserver" in window) {
    const links = navEl.querySelectorAll("a");
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        links.forEach(function (l) {
          const on = l.dataset.target === entry.target.id;
          l.classList.toggle("active", on);
          if (on) l.scrollIntoView({ block: "nearest", inline: "center" });
        });
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    menuEl.querySelectorAll("section.cat").forEach(function (s) { io.observe(s); });
  }
})();
